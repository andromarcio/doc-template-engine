# spec-guard.yml — CI de integridade da especificação (template do doc-template-engine).
#
# COMO USAR NA INSTÂNCIA: copie este arquivo para `.github/workflows/spec-guard.yml`
# (a instância já carrega `scripts/` do engine). Com "branch protection" exigindo
# estes checks, um elo unilateral ou um artefato fora do contrato NÃO entra na main —
# o que era disciplina auditável vira enforcement.
#
# Jobs:
#   estrutura      → validate-doc.mjs em todos os artefatos de nível (N0–N3, data-model)
#   rastreabilidade→ audit-trace-links.mjs (elos nos 3 lugares) + suspect-links.mjs
#                    (alvo mudou depois da verificação — carimbos trace-verified,
#                    fingerprint de conteúdo: independe do histórico do git)
#   aprovacao      → check-approval-trailers.mjs: commit que entra na main tocando
#                    modules/|global/ precisa do trailer "Approved-by: Nome <email>"
#
# A lógica mora nos scripts (portáteis para qualquer forge); este YAML é só o invólucro.

name: spec-guard

on:
  pull_request:
    paths: ["modules/**", "global/**", "scripts/**"]
  push:
    branches: [main]

jobs:
  estrutura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: validate-doc em todos os artefatos de nível
        run: |
          files=$(git ls-files \
            'global/N0_PRODUCT_VISION.md' \
            'global/DATA-MODEL.md' \
            'global/data-models/*.md' \
            'modules/*/README.md' \
            'modules/*/*/README.md' \
            'modules/*/*/f-*.md')
          if [ -z "$files" ]; then echo "Nenhum artefato de nível ainda — ok."; exit 0; fi
          # shellcheck disable=SC2086
          node scripts/validate-doc.mjs $files

  rastreabilidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: elos história↔feature consistentes nas três fontes
        run: node scripts/audit-trace-links.mjs
      - name: elos suspeitos (alvo mudou após a verificação)
        run: node scripts/suspect-links.mjs

  aprovacao:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: trailer Approved-by nos commits que entram na main
        run: |
          BEFORE="${{ github.event.before }}"
          if echo "$BEFORE" | grep -q '^0\+$'; then
            echo "Branch novo — sem intervalo para checar."; exit 0
          fi
          # Padrão: exige o trailer nos MERGE commits do intervalo. Se o repositório
          # usa squash-merge (sem merge commit), acrescente --all.
          node scripts/check-approval-trailers.mjs --range "$BEFORE..${{ github.sha }}"
